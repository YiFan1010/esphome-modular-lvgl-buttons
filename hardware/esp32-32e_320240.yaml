
preferences:
  flash_write_interval: 5min

#pca9554:
#  - id: pca9557_io
#    address: 0x19 # 設定PCA9557的I2C位址
# -------------------------------------------
# LCD Back light
# -------------------------------------------
output:
    # Backlight LED
  - platform: ledc
    pin: GPIO27
    id: led_back_light
    frequency: 1000Hz
 
light:
  - platform: monochromatic
    output: led_back_light
    name: Backlight
    id: display_backlight
    restore_mode: ALWAYS_ON

globals:
  - id: backlight_dimmed
    type: bool
    restore_value: no
    initial_value: 'false'

spi:
- id: tft_spi
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12 
#- id: touch_spi
#  clk_pin: 25
#  mosi_pin: 32
#  miso_pin: 35

display:
  - platform: mipi_spi
    id: my_display
    model: st7789v
    spi_id: tft_spi
    dc_pin: GPIO2
    cs_pin: GPIO15
  #  reset_pin: 15
    invert_colors: true
    show_test_card: false
    update_interval: never
    auto_clear_enabled: false
    #rotation: 90
    transform:
      swap_xy: True
      mirror_x: True
      mirror_y: False
    dimensions:
      height: 240
      width: 320

touchscreen:
  platform: xpt2046
  id: tft_touchscreen
#  spi_id: touch_spi
  cs_pin: GPIO33
  interrupt_pin: GPIO36
  threshold: 200
  calibration:
    x_min: 300
    x_max: 3800
    y_min: 300
    y_max: 3800
  transform:
    mirror_x: true
    mirror_y: false
    swap_xy: true
# Special LVGL settings required for this display
lvgl:
  rotation: ${rotation | default("0")}
