# Board: ESP-01S 1 Channel Relay
# Definition: definitions/boards/esp_01s_1_channel_relay/manifest.yaml

esphome:
  name: esp01s
  friendly_name: esp01s

esp8266:
  board: esp01_1m

logger:

api:
ota:
  - platform: esphome
    password: !secret esp01s__ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: esp01s Fallback Hotspot
    password: "1234567890"
captive_portal:

sensor:
  - platform: wifi_signal
    id: sensor_wifi_signal_1
    name: wifi signal
    update_interval: 600s
  - platform: uptime
    id: uptime_sensor_days
    name: Uptime in Days
    update_interval: 60s

switch:
  - platform: gpio
    id: switch_gpio_1
    inverted: true
    name: Heart switch
    pin:
      number: GPIO3
    on_turn_on:
      - then:
          - delay:
              milliseconds: '500'
          - switch.turn_off: switch_gpio_1