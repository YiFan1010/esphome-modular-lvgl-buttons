script:
  - id: light_down_tft
    then:
      - if:
          condition:
            lambda: 'return !id(backlight_dimmed);'
          then:
            - light.turn_on:
                id: display_backlight
                brightness: 30%
            - lvgl.page.show: main_page
            - lvgl.widget.show: idle_page
            - lambda: id(backlight_dimmed) = true;
            - logger.log: "螢幕閒置 30 秒，亮度降至 30"
  - id: light_up_tft
    then:
      - lvgl.widget.hide: idle_page
      - lvgl.page.show: main_page
      - if:
          condition:
            lambda: 'return id(backlight_dimmed);'
          then:
            - light.turn_on:
                id: display_backlight
                brightness: 100%
            - lambda: id(backlight_dimmed) = false;
            - logger.log: "螢幕被喚醒，亮度恢復 100"
            - lvgl.resume:
