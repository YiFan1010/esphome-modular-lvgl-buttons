lvgl:
  buffer_size: 80%
  on_idle:
    timeout: 30000ms
    then:
      - script.execute: light_down_tft

  top_layer:
    widgets:
      - obj:
          id: idle_page
          bg_color: 0x000000
          bg_opa: 0
          width: 320
          height: 240
          on_click:
            - script.execute: light_up_tft

  pages:
    - id: main_page
      layout: 2x2
      styles: page_style
      <<: !include esphome-modular-lvgl-buttons/common/swipe_navigation.yaml
      widgets:

        # BUTTON 0
        - container:
            id: sw_container_0
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_row_span: 1
            grid_cell_column_span: 1
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            widgets:
              - button:
                  id: sw_btn_0
                  widgets:
                    - label:
                        id: sw_icon_0
                        text_font: mdi_icons
                        align: center
                        text: "\\U000F005E"
                    - label:
                        id: sw_label_0
                        align: bottom_center
                        text_font: font_cn
                        text: "Button 1"
                  on_short_click:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data:
                          entity_id: !lambda 'return id(btn_entity_id_0).c_str();'

        - container:
            id: lt_container_0
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_row_span: 1
            grid_cell_column_span: 1
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            hidden: true
            widgets:
              - button:
                  id: lt_btn_0
                  widgets:
                    - label:
                        id: lt_icon_0
                        text_font: mdi_icons
                        align: center
                        text: "\\U000F005E"
                    - label:
                        id: lt_label_0
                        align: bottom_center
                        text_font: font_cn
                        text: "Button 1"
                  on_short_click:
                    - homeassistant.action:
                        action: light.toggle
                        data:
                          entity_id: !lambda 'return id(btn_entity_id_0).c_str();'
                  on_long_click:
                    duration: 500ms
                    then:
                      - lvgl.page.show:
                          id: lt_page_0
                          animation: MOVE_DOWN
                          time: 300ms

        - container:
            id: sn_container_0
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            grid_cell_row_span: 1
            grid_cell_column_span: 1
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            hidden: true
            widgets:
              - button:
                  id: sn_btn_0
