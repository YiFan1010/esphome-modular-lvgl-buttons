substitutions:
  button_on_color: "ep_orange"
  button_off_color: "very_dark_gray"
  icon_on_color: "yellow"
  icon_off_color: "gray"
  label_on_color: "white"
  label_off_color: "gray"
  display_backlight_timeout_always_enabled: "false"
  display_backlight_timeout_initial: "30"

esphome:
  name: office-panel
  name_add_mac_suffix: false
  friendly_name: Office Panel
  on_boot:
    - priority: 550
      then:
        - delay: 2s
        - lambda: |-
            auto *mgr = App.get_component<config_manager::ConfigManagerComponent>("config_manager");
            if (!mgr) return;
            auto &b = mgr->buttons_;
            if (b.size() > 0) { id(btn_entity_id_0) = b[0].entity_id; }
            if (b.size() > 1) { id(btn_entity_id_1) = b[1].entity_id; }
            if (b.size() > 2) { id(btn_entity_id_2) = b[2].entity_id; }
            if (b.size() > 3) { id(btn_entity_id_3) = b[3].entity_id; }
            if (b.size() > 0) {
              if (b[0].type == "switch") { id(sw_container_0).show(); id(lt_container_0).hide(); id(sn_container_0).hide(); }
              else if (b[0].type == "light")  { id(sw_container_0).hide(); id(lt_container_0).show(); id(sn_container_0).hide(); }
              else                             { id(sw_container_0).hide(); id(lt_container_0).hide(); id(sn_container_0).show(); }
              id(sw_label_0).set_text(b[0].label); id(sw_icon_0).set_text(mgr->get_icon_hex(b[0].icon));
              id(lt_label_0).set_text(b[0].label); id(lt_icon_0).set_text(mgr->get_icon_hex(b[0].icon));
              id(sn_label_0).set_text(b[0].label); id(sn_icon_0).set_text(mgr->get_icon_hex(b[0].icon));
            }
            if (b.size() > 1) {
              if (b[1].type == "switch") { id(sw_container_1).show(); id(lt_container_1).hide(); id(sn_container_1).hide(); }
              else if (b[1].type == "light")  { id(sw_container_1).hide(); id(lt_container_1).show(); id(sn_container_1).hide(); }
              else                             { id(sw_container_1).hide(); id(lt_container_1).hide(); id(sn_container_1).show(); }
              id(sw_label_1).set_text(b[1].label); id(sw_icon_1).set_text(mgr->get_icon_hex(b[1].icon));
              id(lt_label_1).set_text(b[1].label); id(lt_icon_1).set_text(mgr->get_icon_hex(b[1].icon));
              id(sn_label_1).set_text(b[1].label); id(sn_icon_1).set_text(mgr->get_icon_hex(b[1].icon));
            }
            if (b.size() > 2) {
              if (b[2].type == "switch") { id(sw_container_2).show(); id(lt_container_2).hide(); id(sn_container_2).hide(); }
              else if (b[2].type == "light")  { id(sw_container_2).hide(); id(lt_container_2).show(); id(sn_container_2).hide(); }
              else                             { id(sw_container_2).hide(); id(lt_container_2).hide(); id(sn_container_2).show(); }
              id(sw_label_2).set_text(b[2].label); id(sw_icon_2).set_text(mgr->get_icon_hex(b[2].icon));
              id(lt_label_2).set_text(b[2].label); id(lt_icon_2).set_text(mgr->get_icon_hex(b[2].icon));
              id(sn_label_2).set_text(b[2].label); id(sn_icon_2).set_text(mgr->get_icon_hex(b[2].icon));
            }
            if (b.size() > 3) {
              if (b[3].type == "switch") { id(sw_container_3).show(); id(lt_container_3).hide(); id(sn_container_3).hide(); }
              else if (b[3].type == "light")  { id(lt_container_3).show(); id(sw_container_3).hide(); id(sn_container_3).hide(); }
              else                             { id(sn_container_3).show(); id(sw_container_3).hide(); id(lt_container_3).hide(); }
              id(sw_label_3).set_text(b[3].label); id(sw_icon_3).set_text(mgr->get_icon_hex(b[3].icon));
              id(lt_label_3).set_text(b[3].label); id(lt_icon_3).set_text(mgr->get_icon_hex(b[3].icon));
              id(sn_label_3).set_text(b[3].label); id(sn_icon_3).set_text(mgr->get_icon_hex(b[3].icon));
            }

esp32_ble_tracker:
  scan_parameters:
    interval: 110ms
    window: 110ms
    active: true

bluetooth_proxy:
  active: true

esp32:
  board: esp32s3box
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_LITTLEFS_SIZE: "0x200000"

