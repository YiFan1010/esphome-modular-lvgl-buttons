---
button:
  - platform: restart
    name: "Restart"
    entity_category: config

  - platform: factory_reset
    name: "Factory Reset"
    id: Reset
    entity_category: config

sensor:
  - platform: wifi_signal
    name: "WiFi Signal dB"
    id: wifi_signal_db
    update_interval: 60s
    internal: true

  - platform: internal_temperature
    id: cpu_temperature
    name: "CPU Temperature"
    filters:
      - lambda: return (x * 1.8) + 32;
    unit_of_measurement: "°F"
    icon: mdi:thermometer
    entity_category: diagnostic

  # Reports the WiFi signal strength in %
  - platform: copy
    id: wifi_signal_db_percent
    source_id: wifi_signal_db
    name: "WiFi Strength"
    icon: mdi:wifi
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
      - throttle: 60s
    unit_of_measurement: "%"
    entity_category: diagnostic
    on_value:
      then:
        - lvgl.label.update:
            id: wifi_signal_db_percent_label
            text:
              format: "%.0f%%"
              args: ['id(wifi_signal_db_percent).state']
  #Internal RAM (DRAM / IRAM)
  - platform: template
    name: "Free Internal RAM"
    unit_of_measurement: "bytes"
    update_interval: 60s
    lambda: |-
      #include "esp_heap_caps.h"
      return heap_caps_get_free_size(MALLOC_CAP_INTERNAL);

  #PSRAM
  - platform: template
    name: "Free PSRAM"
    unit_of_measurement: "bytes"
    update_interval: 60s
    lambda: |-
      #include "esp_heap_caps.h"
      return heap_caps_get_free_size(MALLOC_CAP_SPIRAM);

  #Total RAM (Internal + PSRAM)
  - platform: template
    name: "Free Total RAM"
    unit_of_measurement: "bytes"
    update_interval: 60s
    lambda: |-
      #include "esp_heap_caps.h"
      size_t internal_free = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
      size_t psram_free = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
      return internal_free + psram_free;

binary_sensor:
  - platform: status
    name: "Status"
    icon: mdi:check-network-outline
    entity_category: diagnostic

text_sensor:
  - platform: template
    id: device_last_restart
    name: 'Last Restart'
    icon: mdi:clock
    entity_category: diagnostic

  - platform: version
    id: esphome_version
    name: 'ESPHome Version'
    hide_timestamp: true
    hide_hash: true
    icon: mdi:source-branch
    entity_category: diagnostic
    on_value:
      then:
        - lvgl.label.update:
            id: esphome_version_label
            text:
              format: "%s"
              args: ['id(esphome_version).state.c_str()']

  - platform: wifi_info
    mac_address:
      id: mac_address
      name: "MAC Address"
      icon: mdi:network-pos
      entity_category: diagnostic
      on_value:
        - lvgl.label.update:
            id: connected_mac_label
            text:
              format: "%s"
              args: ['id(mac_address).state.c_str()']

    ip_address:
      id: ip_address
      name: "IP Address"
      icon: mdi:ip-network
      entity_category: diagnostic
      on_value:
        then:
          - lvgl.label.update:
              id: ip_address_label
              text:
                format: "%s"
                args: ['id(ip_address).state.c_str()']

    ssid:
      id: connected_ssid
      name: "Connected SSID"
      icon: mdi:wifi-check
      entity_category: diagnostic
      on_value:
        then:
          - lvgl.label.update:
              id: connected_ssid_label
              text:
                format: "%s"
                args: ['id(connected_ssid).state.c_str()']

  - platform: template
    name: "Device Name"
    id: device_name
    internal: true
    lambda: |-
      return {App.get_name().c_str()};
    on_value:
      then:
        - lvgl.label.update:
            id: device_name_label
            text:
              format: "%s"
              args: ['id(device_name).state.c_str()']
        - lvgl.qrcode.update:
            id: cp_login
            text:
              format: "WIFI:S:%s;T:WPA;P:password;;"
              args: ['id(device_name).state.c_str()']
        - logger.log:
            format: "Updated QRcode login info - WIFI:S:%s;T:WPA;P:password;;"
            args: ['id(device_name).state.c_str()']
