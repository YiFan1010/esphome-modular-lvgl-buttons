# ── Package 變數說明 ──────────────────────────────────────────
# vars:
#   uid:          模組唯一識別碼 (例如: door_lock)
#   entity_id:    HA Switch entity, e.g. "switch.front_door_lock"
#   camera_src:   go2rtc 的相機名稱, e.g. "front_door"
#   go2rtc_host:  go2rtc 的 IP/Port, e.g. "192.168.1.100:1984"
#   row:          主畫面 Grid 行
#   column:       主畫面 Grid 列
#   text:         Tile 顯示文字
#   icon:         Tile 圖示
#   row_span:     (預設: 1)
#   column_span:  (預設: 1)
#   page_id:      主頁面 ID (預設: main_page)

globals:
  - id: ${uid}_is_on
    type: bool
    initial_value: 'false'
  - id: ${uid}_frame_count
    type: int
    initial_value: '0'
  - id: ${uid}_stream_active
    type: bool
    initial_value: 'false'

# ── 0. 網路請求基礎元件 ───────────────────────────────────────
http_request:
  id: ${uid}_http_req
  timeout: 5s

# ── 1. go2rtc 影像抓取器 (已升級為 image 平台語法) ─────────────
image:
  - platform: online_image
    id: ${uid}_camera_img
    url: "http://${go2rtc_host}/api/frame.jpeg?src=${camera_src}&width=320&height=240&q=35"
    format: JPG
    type: RGB565
    update_interval: never
    on_download_finished:
      then:
        - lambda: |-
            if (id(${uid}_stream_active)) {
              id(${uid}_frame_count) += 1;
            }

# ── 2. 控制定時器 ─────────────────────────────────────────────
interval:
  - interval: 300ms
    id: ${uid}_cam_refresh_timer
    then:
      - if:
          condition:
            lambda: return id(${uid}_stream_active);
          then:
            - component.update: ${uid}_camera_img

  - interval: 1s
    id: ${uid}_fps_calc_timer
    then:
      - lambda: |-
          if (id(${uid}_stream_active)) {
            int count = id(${uid}_frame_count);
            id(${uid}_frame_count) = 0;
            auto fps_lbl = id(lbl_fps_${uid});
            if (fps_lbl != nullptr) {
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f FPS", (float)count);
              lv_label_set_text(fps_lbl, buf);
            }
          }

# ── 3. 腳本區塊 ───────────────────────────────────────────────
script:
  # ▶️ 開啟彈窗 Modal 並啟動串流
  - id: ${uid}_open_modal
    then:
      - lambda: |-
          id(${uid}_frame_count) = 0;
          id(${uid}_stream_active) = true;
      - lvgl.widget.show: modal_${uid}
      - component.update: ${uid}_camera_img

  # ⏹️ 關閉彈窗 Modal 並停止串流
  - id: ${uid}_close_modal
    then:
      - lambda: |-
          id(${uid}_stream_active) = false;
      - lvgl.widget.hide: modal_${uid}

  # 🔓 觸發開鎖動作 (Switch.turn_on)
  - id: ${uid}_unlock_action
    then:
      - homeassistant.service:
          service: switch.turn_on
          data:
            entity_id: ${entity_id}
      - delay: 2s
      - script.execute: ${uid}_close_modal

  # 🔄 同步 HA 狀態至 LVGL Tile 顏色
  - id: ${uid}_sync_state
    then:
      - if:
          condition:
            lambda: return id(${uid}_is_on);
          then:
            - lvgl.widget.update:
                id: button_${uid}
                bg_color: $button_on_color
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: $icon_on_color
            - lvgl.widget.update:
                id: label_${uid}
                text_color: $label_on_color
          else:
            - lvgl.widget.update:
                id: button_${uid}
                bg_color: $button_off_color
            - lvgl.widget.update:
                id: icon_${uid}
                text_color: $icon_off_color
            - lvgl.widget.update:
                id: label_${uid}
                text_color: $label_off_color

# ── 4. LVGL UI 介面設定 ───────────────────────────────────────
lvgl:
  pages:
    - id: !extend ${page_id | default("main_page")}
      widgets:
        - container:
            id: ${uid}_tile
            grid_cell_row_pos: ${row}
            grid_cell_column_pos: ${column}
            grid_cell_row_span: ${row_span | default(1)}
            grid_cell_column_span: ${column_span | default(1)}
            grid_cell_x_align: stretch
            grid_cell_y_align: stretch
            widgets:
              - button:
                  id: button_${uid}
                  widgets:
                    - label:
                        id: icon_${uid}
                        text_font: $icon_font
                        align: top_left
                        text: ${icon}
                    - label:
                        id: label_${uid}
                        align: bottom_left
                        long_mode: wrap
                        width: 100%
                        text_font: $title_font
                        text: ${text}
                  on_short_click:
                    then:
                      - script.execute: ${uid}_open_modal

  top_layer:
    widgets:
      - obj:
          id: modal_${uid}
          width: 320
          height: 240
          align: center
          pad_all: 0
          hidden: true
          widgets:
            # 1. 全螢幕影像 (底層)
            - image:
                src: ${uid}_camera_img
                align: center
                width: 320
                height: 240

            # 2. 左上角：半透明解鎖按鈕
            - button:
                align: top_left
                x: 8
                y: 8
                width: 100
                height: 38
                bg_color: 0x000000
                bg_opa: 50%
                border_width: 1
                border_color: 0xE53935
                radius: 8
                widgets:
                  - label:
                      align: center
                      text: "🔓 解鎖"
                      text_color: 0xFFFFFF
                on_click:
                  then:
                    - script.execute: ${uid}_unlock_action

            # 3. 右上角：返回箭頭按鈕 + FPS 顯示
            - container:
                align: top_right
                x: -8
                y: 8
                width: 110
                height: 38
                bg_opa: '0%'
                pad_all: 0
                layout:
                  type: flex
                  flex_flow: row
                  flex_align_main: end
                  flex_align_cross: center
                widgets:
                  - label:
                      id: lbl_fps_${uid}
                      text: "0.0 FPS"
                      text_color: 0x00FF00
                      margin_right: 8

                  - button:
                      width: 38
                      height: 38
                      bg_color: 0x000000
                      bg_opa: 50%
                      radius: 8
                      widgets:
                        - label:
                            align: center
                            text_font: $icon_font
                            text: ${mdi_chevron_left}
                            text_color: 0xFFFFFF
                      on_click:
                        then:
                          - script.execute: ${uid}_close_modal

# ── 5. HA 狀態同步 ───────────────────────────────────────────
binary_sensor:
  - platform: homeassistant
    id: ${uid}_ha_state
    entity_id: ${entity_id}
    trigger_on_initial_state: true
    on_state:
      - lambda: id(${uid}_is_on) = x;
      - script.execute: ${uid}_sync_state
