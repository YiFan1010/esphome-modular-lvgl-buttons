---
# Shared light detail page — RGB / CCT / brightness / effect UI
# Calls abstract scripts defined by the button that includes this page.
# Works identically for both local ESPHome lights and remote HA lights.
#
# vars:
#   uid:      must match the including button's uid
#   text:     light name shown on the detail page header
#   page_id:  parent page to return to (default: main_page)
#
# Scripts the button MUST define:
#   ${uid}_light_toggle             — toggle the light on/off
#   ${uid}_light_set_brightness     — apply id(${uid}_current_brightness) [0.0–1.0]
#   ${uid}_light_apply_hs           — apply id(${uid}_current_hue) [0–360] + id(${uid}_current_saturation) [0–100]
#   ${uid}_light_apply_color_temp   — apply id(${uid}_current_color_temp) [Kelvin]
#   ${uid}_light_apply_effect_day   — apply effect "day" if supported
#   ${uid}_light_apply_effect_night — apply effect "night" if supported
#
# Globals the button MUST keep up-to-date:
#   ${uid}_is_on                   bool
#   ${uid}_current_brightness      float  0.0–1.0
#   ${uid}_current_hue             float  0–360
#   ${uid}_current_saturation      float  0–100
#   ${uid}_current_color_temp      float  Kelvin
#   ${uid}_current_effect          string current effect name
#   ${uid}_supports_rgb            bool
#   ${uid}_supports_color_temp     bool
#   ${uid}_supports_brightness      bool
#   ${uid}_supports_effect          bool
#   ${uid}_supports_day_effect      bool
#   ${uid}_supports_night_effect    bool

globals:
# ──────────────────────────────────────────────────────────────────────────────
# Light state and current values
# ──────────────────────────────────────────────────────────────────────────────
- id: ${uid}_current_hue
  type: float
  initial_value: '0.0'

- id: ${uid}_current_saturation
  type: float
  initial_value: '0.0'

- id: ${uid}_current_brightness
  type: float
  initial_value: '1.0'

- id: ${uid}_current_color_temp
  type: float
  initial_value: '4000.0'

- id: ${uid}_current_effect
  type: std::string
  initial_value: '""'

- id: ${uid}_is_temp_mode
  type: bool
  initial_value: 'false'

# ──────────────────────────────────────────────────────────────────────────────
# Capability flags detected from Home Assistant supported_color_modes / effect_list
# ──────────────────────────────────────────────────────────────────────────────
- id: ${uid}_supports_rgb
  type: bool
  initial_value: 'false'

- id: ${uid}_supports_color_temp
  type: bool
  initial_value: 'false'

- id: ${uid}_supports_brightness
  type: bool
  initial_value: 'false'

- id: ${uid}_supports_effect
  type: bool
  initial_value: 'false'

- id: ${uid}_supports_day_effect
  type: bool
  initial_value: 'false'

- id: ${uid}_supports_night_effect
  type: bool
  initial_value: 'false'

- id: ${uid}_is_on
  type: bool
  initial_value: 'false'

lvgl:
  gradients:
  - id: ${uid}_hue_gradient
    direction: ver
    stops:
    - color: 0xff0000
      position: 0
    - color: 0xff00ff
      position: 42
    - color: 0x0000ff
      position: 84
    - color: 0x00ffff
      position: 127
    - color: 0x00ff00
      position: 169
    - color: 0xffff00
      position: 212
    - color: 0xff0000
      position: 255

  - id: ${uid}_color_temp_gradient
    direction: ver
    stops:
    - color: 0xa0c8ff
      position: 0
    - color: 0xe0f7ff
      position: 80
    - color: 0xffffff
      position: 128
    - color: 0xffffe0
      position: 175
    - color: 0xffd6a0
      position: 255

  pages:
  # ────────────────────────────────────────────────────────────────────────────
  # DETAIL PAGE
  # ────────────────────────────────────────────────────────────────────────────
  - id: ${uid}_light_page
    styles: page_style
    scrollable: false
    scrollbar_mode: "OFF"
    widgets:

    # -------------------------------------------------------------------------
    # BRIGHTNESS SLIDER
    # This is shown whenever the light supports brightness.
    # -------------------------------------------------------------------------
    - obj:
        id: ${uid}_brightness_bg
        x: 10
        y: 10
        width: 42
        height: 165
        align: left_mid
        widgets:
        - slider:
            id: ${uid}_brightness_slider
            width: 14
            height: 120
            align: center
            y: -14
            min_value: 2
            max_value: 255
            radius: 6
            bg_color: steel_blue
            knob:
              pad_top: -4
              pad_bottom: -4
              bg_color: deep_orange
            indicator:
              radius: 0
              bg_color: misty_blue
            on_value:
            - globals.set:
                id: ${uid}_current_brightness
                value: !lambda return x / 255.0f;
            - script.execute: ${uid}_update_bulb_color
            on_release:
            - script.execute: ${uid}_light_set_brightness
        - label:
            align: bottom_mid
            y: -5
            text_font: $icon_font
            text: $mdi_brightness_6
            text_color: white

    # -------------------------------------------------------------------------
    # SATURATION SLIDER
    # Only visible in RGB/HS mode.
    # -------------------------------------------------------------------------
    - obj:
        id: ${uid}_saturation_bg
        x: 58
        y: 10
        width: 42
        height: 165
        align: left_mid
        widgets:
        - slider:
            id: ${uid}_saturation_slider
            width: 14
            height: 120
            align: center
            y: -14
            min_value: 0
            max_value: 100
            radius: 6
            bg_color: steel_blue
            knob:
              pad_top: -4
              pad_bottom: -4
              bg_color: red
            indicator:
              radius: 0
              bg_color: misty_blue
            on_value:
            - globals.set:
                id: ${uid}_current_saturation
                value: !lambda return x;
            - script.execute: ${uid}_update_bulb_color
            on_release:
            - script.execute: ${uid}_light_apply_hs
        - label:
            align: bottom_mid
            y: -2
            text_font: $icon_font
            text: $mdi_circle_opacity
            text_color: white

    # -------------------------------------------------------------------------
    # EFFECT BUTTON GROUP
    # This block is hidden unless the light supports effects.
    # It automatically shows Day / Night buttons only when those effects exist.
    # -------------------------------------------------------------------------
    - obj:
        id: ${uid}_effect_bg
        hidden: true
        x: 10
        y: 185
        width: 120
        height: 58
        align: left_mid
        bg_opa: transp
        border_opa: transp
        widgets:
        - button:
            id: ${uid}_day_btn
            hidden: true
            width: 48
            height: 38
            align: left_mid
            radius: 8
            bg_color: $button_off_color
            border_width: 1
            border_color: $label_off_color
            on_click:
            - script.execute: ${uid}_light_apply_effect_day
            widgets:
            - label:
                align: center
                text_font: $title_font
                text_color: $label_on_color
                text: "DAY"
        - button:
            id: ${uid}_night_btn
            hidden: true
            width: 48
            height: 38
            align: right_mid
            radius: 8
            bg_color: $button_off_color
            border_width: 1
            border_color: $label_off_color
            on_click:
            - script.execute: ${uid}_light_apply_effect_night
            widgets:
            - label:
                align: center
                text_font: $title_font
                text_color: $label_on_color
                text: "NIGHT"

    # -------------------------------------------------------------------------
    # LIGHT NAME LABEL
    # -------------------------------------------------------------------------
    - label:
        id: ${uid}_detail_name_label
        y: 10
        x: 8
        height: 24
        width: 150
        long_mode: dot
        align: top_left
        text_font: $title_font
        text_align: center
        text_color: misty_blue
        text: ${text}

    # -------------------------------------------------------------------------
    # ARC BACKGROUND CONTAINER
    # This large circular area is used by Hue / Color temperature modes.
    # Depending on light capabilities it can show one or both arc controls.
    # -------------------------------------------------------------------------
    - obj:
        id: ${uid}_arc_bg
        hidden: false
        width: 180
        height: 260
        align: right_mid
        pad_all: 0
        bg_opa: transp
        clickable: false
        scrollable: false
        border_opa: transp
        border_width: 0
        shadow_opa: transp
        widgets:
        - obj:
            x: 70
            width: 220
            height: 220
            scrollable: false
            align: right_mid
            pad_all: 0
            bg_opa: transp
            shadow_opa: transp
            border_opa: transp
            border_width: 0
            widgets:
            - obj:
                width: 220
                height: 220
                align: center
                clickable: true
                radius: 110
                bg_opa: transp
                border_opa: transp
                border_width: 0
                scrollable: false

        - obj:
            id: ${uid}_hue_gradient_obj
            hidden: true
            x: 70
            width: 220
            height: 220
            radius: 110
            align: right_mid
            pad_all: 0
            bg_grad: ${uid}_hue_gradient
            bg_grad_dir: ver
            shadow_opa: transp
            border_opa: transp
            border_width: 0
            bg_opa: cover
            scrollable: false

        - obj:
            id: ${uid}_color_temp_gradient_obj
            x: 70
            width: 220
            height: 220
            radius: 110
            align: right_mid
            pad_all: 0
            bg_grad: ${uid}_color_temp_gradient
            bg_grad_dir: ver
            shadow_opa: transp
            border_opa: transp
            border_width: 0
            bg_opa: cover
            scrollable: false

        - obj:
            x: 50
            width: 180
            height: 180
            align: right_mid
            clickable: false
            radius: 90
            border_width: 0
            border_opa: transp
            bg_opa: cover
            scrollable: false

        - obj:
            x: 46
            width: 172
            height: 172
            align: right_mid
            radius: 86
            border_opa: transp
            border_width: 0
            scrollable: false

        - obj:
            x: 70
            width: 220
            height: 220
            radius: 110
            align: right_mid
            pad_all: 0
            bg_opa: transp
            shadow_opa: transp
            border_opa: transp
            border_width: 0
            scrollable: false
            widgets:
            # HUE ARC
            - arc:
                id: ${uid}_arc_hue
                hidden: true
                clickable: true
                adjustable: true
                adv_hittest: true
                align: center
                width: 220
                height: 220
                start_angle: 0
                end_angle: 180
                min_value: 0
                max_value: 360
                value: 0
                arc_width: 20
                rotation: 90.0
                arc_opa: transp
                indicator:
                  arc_opa: transp
                  arc_width: 20
                knob:
                  pad_all: 0
                  bg_opa: transp
                  border_color: steel_blue
                  border_width: 3
                  shadow_opa: transp
                on_value:
                - globals.set:
                    id: ${uid}_current_hue
                    value: !lambda return x;
                - script.execute: ${uid}_update_bulb_color
                on_release:
                - script.execute: ${uid}_light_apply_hs

            # COLOR TEMP ARC
            - arc:
                id: ${uid}_arc_color_temp
                hidden: false
                clickable: true
                adjustable: true
                adv_hittest: true
                align: center
                width: 220
                height: 220
                start_angle: 0
                end_angle: 180
                min_value: 2000
                max_value: 6500
                value: 4000
                arc_width: 20
                rotation: 90.0
                arc_opa: transp
                indicator:
                  arc_opa: transp
                  arc_width: 34
                knob:
                  pad_all: 0
                  bg_opa: transp
                  border_color: steel_blue
                  border_width: 3
                  shadow_opa: transp
                on_value:
                - globals.set:
                    id: ${uid}_current_color_temp
                    value: !lambda return x;
                - script.execute: ${uid}_update_bulb_color
                on_release:
                - script.execute: ${uid}_light_apply_color_temp

    # -------------------------------------------------------------------------
    # LIGHTBULB TOGGLE BUTTON
    # This is the main power button; it toggles the light on/off.
    # -------------------------------------------------------------------------
    - button:
        id: ${uid}_bulb_btn
        x: -20
        y: 0
        width: 54
        height: 54
        align: right_mid
        bg_opa: transp
        shadow_opa: cover
        shadow_spread: 2
        shadow_width: 12
        shadow_color: 0x888888
        border_width: 0
        radius: 27
        on_short_click:
        - script.execute: ${uid}_light_toggle
        widgets:
        - label:
            id: ${uid}_bulb_icon
            align: center
            text_font: $icon_font
            text_color: 0x888888
            text: $mdi_lightbulb

    # -------------------------------------------------------------------------
    # BACK BUTTON
    # Returns to parent page.
    # -------------------------------------------------------------------------
    - obj:
        id: ${uid}_back_btn
        x: 110
        y: -4
        width: 45
        height: 32
        align: bottom_left
        bg_opa: transp
        pad_all: 0
        border_opa: transp
        border_width: 0
        shadow_opa: transp
        radius: 0
        widgets:
        - obj:
            y: -4
            width: 40
            height: 4
            align: bottom_mid
            bg_color: steel_blue
            pad_all: 0
            border_opa: transp
            border_width: 0
            shadow_opa: transp
            radius: 8
            scrollable: false
        - label:
            align: center
            text_font: $icon_font
            text_color: steel_blue
            text: $mdi_chevron_up
        on_click:
        - lvgl.page.show:
            id: ${page_id | default("main_page")}
            animation: MOVE_RIGHT
            time: 300ms

script:
# ════════════════════════════════════════════════════════════════════════════════
# Sync globals → LVGL widgets (called after any state change)
# ════════════════════════════════════════════════════════════════════════════════
- id: ${uid}_sync_state
  then:
  # Update the tile button appearance depending on whether the light is on or off.
  - if:
      condition:
        lambda: return id(${uid}_is_on);
      then:
      - lvgl.widget.update:
          id: button_${uid}
          bg_color: $button_on_color
      - lvgl.widget.update:
          id: icon_${uid}
          text_color: $icon_on_color
      - lvgl.widget.update:
          id: label_${uid}
          text_color: $label_on_color
      - lvgl.widget.update:
          id: slider_${uid}
          knob:
            bg_color: $label_on_color
      else:
      - lvgl.widget.update:
          id: button_${uid}
          bg_color: $button_off_color
      - lvgl.widget.update:
          id: icon_${uid}
          text_color: $icon_off_color
      - lvgl.widget.update:
          id: label_${uid}
          text_color: $label_off_color
      - lvgl.widget.update:
          id: slider_${uid}
          knob:
            bg_color: $label_off_color

  # Sync grid brightness slider with current brightness value.
  - lvgl.slider.update:
      id: slider_${uid}
      value: !lambda return id(${uid}_current_brightness) * 255;

  # Sync the detail page sliders / arcs.
  - lvgl.slider.update:
      id: ${uid}_brightness_slider
      value: !lambda return id(${uid}_current_brightness) * 255;
  - lvgl.arc.update:
      id: ${uid}_arc_hue
      value: !lambda return (int)id(${uid}_current_hue);
  - lvgl.slider.update:
      id: ${uid}_saturation_slider
      value: !lambda return (int)id(${uid}_current_saturation);
  - lvgl.arc.update:
      id: ${uid}_arc_color_temp
      value: !lambda return (int)id(${uid}_current_color_temp);

  - script.execute: ${uid}_update_visibility

# ════════════════════════════════════════════════════════════════════════════════
# Show/hide detail page controls based on detected capabilities
# ════════════════════════════════════════════════════════════════════════════════
- id: ${uid}_update_visibility
  then:
  # Brightness slider on detail page + tile slider.
  - if:
      condition:
        lambda: return id(${uid}_supports_brightness);
      then:
      - lvgl.widget.show: ${uid}_brightness_bg
      - lvgl.widget.show: slider_${uid}
      else:
      - lvgl.widget.hide: ${uid}_brightness_bg
      - lvgl.widget.hide: slider_${uid}

  # RGB / HS mode display.
  - if:
      condition:
        lambda: return id(${uid}_supports_rgb) && !id(${uid}_is_temp_mode);
      then:
      - lvgl.widget.show: ${uid}_saturation_bg
      - lvgl.widget.show: ${uid}_hue_gradient_obj
      - lvgl.widget.show: ${uid}_arc_hue
      - lvgl.widget.hide: ${uid}_color_temp_gradient_obj
      - lvgl.widget.hide: ${uid}_arc_color_temp
      - lvgl.obj.update:
          id: ${uid}_brightness_bg
          x: -160
      else:
      - lvgl.widget.hide: ${uid}_saturation_bg
      - lvgl.widget.hide: ${uid}_hue_gradient_obj
      - lvgl.widget.hide: ${uid}_arc_hue

  # Color temperature mode display.
  - if:
      condition:
        lambda: return id(${uid}_supports_color_temp) && id(${uid}_is_temp_mode);
      then:
      - lvgl.widget.show: ${uid}_color_temp_gradient_obj
      - lvgl.widget.show: ${uid}_arc_color_temp
      - lvgl.widget.hide: ${uid}_hue_gradient_obj
      - lvgl.widget.hide: ${uid}_arc_hue
      - lvgl.obj.update:
          id: ${uid}_brightness_bg
          x: 35
      else:
      - lvgl.widget.hide: ${uid}_color_temp_gradient_obj
      - lvgl.widget.hide: ${uid}_arc_color_temp

  # Arc background visibility: hide for brightness-only lights.
  - if:
      condition:
        lambda: return id(${uid}_supports_rgb) || id(${uid}_supports_color_temp);
      then:
      - lvgl.widget.show: ${uid}_arc_bg
      else:
      - lvgl.widget.hide: ${uid}_arc_bg

  # Auto-select CCT mode if that is the only supported color capability.
  - if:
      condition:
        lambda: return !id(${uid}_supports_rgb) && id(${uid}_supports_color_temp);
      then:
      - lambda: id(${uid}_is_temp_mode) = true;
      - script.execute: ${uid}_update_visibility

  # Effect UI visibility.
  - if:
      condition:
        lambda: return id(${uid}_supports_effect);
      then:
      - lvgl.widget.show: ${uid}_effect_bg
      - if:
          condition:
            lambda: return id(${uid}_supports_day_effect);
          then:
          - lvgl.widget.show: ${uid}_day_btn
          else:
          - lvgl.widget.hide: ${uid}_day_btn
      - if:
          condition:
            lambda: return id(${uid}_supports_night_effect);
          then:
          - lvgl.widget.show: ${uid}_night_btn
          else:
          - lvgl.widget.hide: ${uid}_night_btn
      else:
      - lvgl.widget.hide: ${uid}_effect_bg
      - lvgl.widget.hide: ${uid}_day_btn
      - lvgl.widget.hide: ${uid}_night_btn

  - script.execute: ${uid}_update_effect_buttons

# ════════════════════════════════════════════════════════════════════════════════
# Update effect button color based on active effect state.
# ════════════════════════════════════════════════════════════════════════════════
- id: ${uid}_update_effect_buttons
  then:
  # Day button: highlight when current effect == "day"
  - if:
      condition:
        lambda: return id(${uid}_supports_day_effect);
      then:
      - if:
          condition:
            lambda: return id(${uid}_current_effect) == "day";
          then:
          - lvgl.widget.update:
              id: ${uid}_day_btn
              bg_color: $button_on_color
              border_color: $label_on_color
          else:
          - lvgl.widget.update:
              id: ${uid}_day_btn
              bg_color: $button_off_color
              border_color: $label_off_color

  # Night button: highlight when current effect == "night"
  - if:
      condition:
        lambda: return id(${uid}_supports_night_effect);
      then:
      - if:
          condition:
            lambda: return id(${uid}_current_effect) == "night";
          then:
          - lvgl.widget.update:
              id: ${uid}_night_btn
              bg_color: $button_on_color
              border_color: $label_on_color
          else:
          - lvgl.widget.update:
              id: ${uid}_night_btn
              bg_color: $button_off_color
              border_color: $label_off_color

# ════════════════════════════════════════════════════════════════════════════════
# Toggle RGB ↔ CCT mode (called on long press of bulb button)
# ════════════════════════════════════════════════════════════════════════════════
- id: ${uid}_toggle_color_mode
  then:
  - if:
      condition:
        lambda: return id(${uid}_supports_rgb) && id(${uid}_supports_color_temp);
      then:
      - lambda: id(${uid}_is_temp_mode) = !id(${uid}_is_temp_mode);
      - script.execute: ${uid}_update_visibility

# ════════════════════════════════════════════════════════════════════════════════
# Update bulb icon glow color from current light state
# ════════════════════════════════════════════════════════════════════════════════
- id: ${uid}_update_bulb_color
  then:
  - lambda: |-
      int r = 153, g = 153, b = 153;

      if (id(${uid}_is_on)) {
        if (id(${uid}_supports_rgb) && !id(${uid}_is_temp_mode)) {
          // HSV → RGB  (v = 1.0, brightness is separate)
          float h = id(${uid}_current_hue);
          float s = id(${uid}_current_saturation) / 100.0f;
          float c = s;
          float xv = c * (1.0f - fabs(fmod(h / 60.0f, 2.0f) - 1.0f));
          float m = 1.0f - c;
          float rp = 0, gp = 0, bp = 0;
          if      (h < 60)  { rp = c;  gp = xv; bp = 0; }
          else if (h < 120) { rp = xv; gp = c;  bp = 0; }
          else if (h < 180) { rp = 0;  gp = c;  bp = xv; }
          else if (h < 240) { rp = 0;  gp = xv; bp = c; }
          else if (h < 300) { rp = xv; gp = 0;  bp = c; }
          else              { rp = c;  gp = 0;  bp = xv; }
          r = (int)((rp + m) * 255);
          g = (int)((gp + m) * 255);
          b = (int)((bp + m) * 255);

        } else if (id(${uid}_supports_color_temp) && id(${uid}_is_temp_mode)) {
          // Kelvin → RGB  (Tanner Helland algorithm)
          float temp = id(${uid}_current_color_temp) / 100.0f;
          float rf = (temp <= 66) ? 255 : 329.698727446f * pow(temp - 60, -0.1332047592f);
          float gf = (temp <= 66) ? 99.4708025861f * log(temp) - 161.1195681661f
                                  : 288.1221695283f * pow(temp - 60, -0.0755148492f);
          float bf = (temp >= 66) ? 255 : (temp <= 19) ? 0
                                  : 138.5177312231f * log(temp - 10) - 305.0447927307f;
          r = std::max(0, std::min(255, (int)rf));
          g = std::max(0, std::min(255, (int)gf));
          b = std::max(0, std::min(255, (int)bf));

        } else {
          // Brightness-only / effect-only light → warm yellow
          r = 255; g = 220; b = 50;
        }

        // Scale by brightness for a better on-screen glow.
        float bd = 0.6f + (id(${uid}_current_brightness) * 0.4f);
        r = (int)(r * bd);
        g = (int)(g * bd);
        b = (int)(b * bd);
      }

      uint32_t color = ((uint32_t)r << 16) | ((uint32_t)g << 8) | (uint32_t)b;
      float br = id(${uid}_current_brightness);
      uint8_t spread = id(${uid}_is_on) ? 2 + (uint8_t)(br * 20) : 2;
      uint8_t width  = id(${uid}_is_on) ? 20 + (uint8_t)(br * 80) : 20;

      lv_obj_set_style_shadow_color(id(${uid}_bulb_btn), lv_color_hex(color), 0);
      lv_obj_set_style_shadow_spread(id(${uid}_bulb_btn), spread, 0);
      lv_obj_set_style_shadow_width(id(${uid}_bulb_btn), width, 0);
