---
# Simplified light detail page — Brightness / CCT / Effect UI
# Designed for easy control with mode selection buttons
#
# vars:
#   uid:      must match the including button's uid
#   text:     light name shown on the detail page header
#   page_id:  parent page to return to (default: main_page)
#
# Scripts the button MUST define:
#   ${uid}_light_toggle             — toggle the light on/off
#   ${uid}_light_set_brightness     — apply id(${uid}_current_brightness) [0.0–1.0]
#   ${uid}_light_apply_color_temp   — apply id(${uid}_current_color_temp) [Kelvin]
#   ${uid}_light_apply_effect_day   — apply effect "day" if supported
#   ${uid}_light_apply_effect_night — apply effect "night" if supported
#
# Globals the button MUST keep up-to-date:
#   ${uid}_is_on                   bool
#   ${uid}_current_brightness      float  0.0–1.0
#   ${uid}_current_color_temp      float  Kelvin
#   ${uid}_current_effect          string current effect name
#   ${uid}_supports_brightness      bool
#   ${uid}_supports_color_temp     bool
#   ${uid}_supports_effect          bool
#   ${uid}_supports_day_effect      bool
#   ${uid}_supports_night_effect    bool

globals:
# ──────────────────────────────────────────────────────────────────────────────
# Light state and current values
# ──────────────────────────────────────────────────────────────────────────────
- id: ${uid}_current_brightness
  type: float
  initial_value: '1.0'

- id: ${uid}_current_color_temp
  type: float
  initial_value: '4000.0'

- id: ${uid}_current_effect
  type: std::string
  initial_value: '""'

# ──────────────────────────────────────────────────────────────────────────────
# UI mode selection: which control is currently active
# ──────────────────────────────────────────────────────────────────────────────
- id: ${uid}_slider_mode
  type: int
  initial_value: '0'  # 0 = brightness, 1 = color_temp, 2 = effect

# ──────────────────────────────────────────────────────────────────────────────
# Capability flags detected from Home Assistant
# ──────────────────────────────────────────────────────────────────────────────
- id: ${uid}_supports_brightness
  type: bool
  initial_value: 'false'

- id: ${uid}_supports_color_temp
  type: bool
  initial_value: 'false'

- id: ${uid}_supports_effect
  type: bool
  initial_value: 'false'

- id: ${uid}_supports_day_effect
  type: bool
  initial_value: 'false'

- id: ${uid}_supports_night_effect
  type: bool
  initial_value: 'false'

- id: ${uid}_is_on
  type: bool
  initial_value: 'false'

lvgl:
  pages:
  # ────────────────────────────────────────────────────────────────────────────
  # SIMPLIFIED DETAIL PAGE
  # ────────────────────────────────────────────────────────────────────────────
  - id: ${uid}_light_page
    styles: page_style
    scrollable: false
    scrollbar_mode: "OFF"
    widgets:

    # -------------------------------------------------------------------------
    # HEADER: Light name + Return button
    # -------------------------------------------------------------------------
    - label:
        id: ${uid}_detail_name_label
        y: 5
        x: 8
        height: 24
        width: 200
        long_mode: dot
        align: top_left
        text_font: $title_font
        text_align: left
        text_color: misty_blue
        text: ${text}

    - button:
        id: ${uid}_back_btn
        x: -8
        y: 5
        width: 40
        height: 24
        align: top_right
        bg_opa: transp
        border_opa: transp
        radius: 6
        on_click:
        - lvgl.page.show:
            id: ${page_id | default("main_page")}
            animation: MOVE_RIGHT
            time: 300ms
        widgets:
        - label:
            align: center
            text_font: $icon_font
            text_color: steel_blue
            text: $mdi_chevron_up

    # -------------------------------------------------------------------------
    # MAIN CONTENT AREA
    # -------------------------------------------------------------------------
    - obj:
        id: ${uid}_content_area
        x: 0
        y: 35
        width: 320
        height: 165
        align: top_left
        bg_opa: transp
        border_opa: transp
        widgets:

        # Power toggle button (center top)
        - button:
            id: ${uid}_power_btn
            x: 0
            y: 10
            width: 60
            height: 60
            align: top_mid
            bg_opa: transp
            border_opa: transp
            on_short_click:
            - script.execute: ${uid}_light_toggle
            widgets:
            - label:
                id: ${uid}_power_icon
                align: center
                text_font: $icon_font
                text_color: 0x888888
                text: $mdi_lightbulb

        # Main slider (center)
        - slider:
            id: ${uid}_main_slider
            x: 0
            y: 80
            width: 260
            height: 20
            align: top_mid
            min_value: 2
            max_value: 255
            radius: 6
            bg_color: steel_blue
            knob:
              pad_top: -3
              pad_bottom: -3
              bg_color: deep_orange
            indicator:
              radius: 0
              bg_color: misty_blue
            on_value:
            - lambda: |-
                if (id(${uid}_slider_mode) == 0) {
                  // Brightness mode
                  id(${uid}_current_brightness) = x / 255.0f;
                } else if (id(${uid}_slider_mode) == 1) {
                  // Color temp mode
                  id(${uid}_current_color_temp) = x;
                }
            on_release:
            - lambda: |-
                if (id(${uid}_slider_mode) == 0) {
                  id(${uid}_current_brightness) = x / 255.0f;
                  // Execute brightness script
                } else if (id(${uid}_slider_mode) == 1) {
                  id(${uid}_current_color_temp) = x;
                  // Execute color temp script
                }

    # -------------------------------------------------------------------------
    # MODE SELECTION BUTTONS (bottom)
    # -------------------------------------------------------------------------
    - obj:
        id: ${uid}_mode_buttons_container
        x: 0
        y: 200
        width: 320
        height: 35
        align: top_left
        bg_opa: transp
        border_opa: transp
        widgets:

        # Brightness mode button
        - button:
            id: ${uid}_mode_brightness_btn
            x: 10
            y: 0
            width: 90
            height: 32
            align: left_mid
            radius: 6
            bg_color: $button_off_color
            border_width: 2
            border_color: $label_off_color
            on_click:
            - script.execute: ${uid}_switch_to_brightness
            widgets:
            - label:
                align: center
                text_font: $text_font
                text_color: $label_on_color
                text: "☀ BRIGHT"

        # Color temp mode button
        - button:
            id: ${uid}_mode_temp_btn
            x: 0
            y: 0
            width: 90
            height: 32
            align: center
            radius: 6
            bg_color: $button_off_color
            border_width: 2
            border_color: $label_off_color
            on_click:
            - script.execute: ${uid}_switch_to_temp
            widgets:
            - label:
                align: center
                text_font: $text_font
                text_color: $label_on_color
                text: "◉ TEMP"

        # Effect mode button
        - button:
            id: ${uid}_mode_effect_btn
            hidden: true
            x: -10
            y: 0
            width: 90
            height: 32
            align: right_mid
            radius: 6
            bg_color: $button_off_color
            border_width: 2
            border_color: $label_off_color
            on_click:
            - script.execute: ${uid}_switch_to_effect
            widgets:
            - label:
                align: center
                text_font: $text_font
                text_color: $label_on_color
                text: "🌙 EFFECT"

    # -------------------------------------------------------------------------
    # EFFECT SELECTION AREA (shown when effect mode is active)
    # -------------------------------------------------------------------------
    - obj:
        id: ${uid}_effect_selection
        hidden: true
        x: 0
        y: 200
        width: 320
        height: 35
        align: top_left
        bg_opa: transp
        border_opa: transp
        widgets:

        # Day effect button
        - button:
            id: ${uid}_effect_day_btn
            hidden: true
            x: 20
            y: 0
            width: 130
            height: 32
            align: left_mid
            radius: 6
            bg_color: $button_off_color
            border_width: 2
            border_color: $label_off_color
            on_click:
            - script.execute: ${uid}_light_apply_effect_day
            - script.execute: ${uid}_update_effect_highlight
            widgets:
            - label:
                align: center
                text_font: $text_font
                text_color: $label_on_color
                text: "☀ DAY"

        # Night effect button
        - button:
            id: ${uid}_effect_night_btn
            hidden: true
            x: -20
            y: 0
            width: 130
            height: 32
            align: right_mid
            radius: 6
            bg_color: $button_off_color
            border_width: 2
            border_color: $label_off_color
            on_click:
            - script.execute: ${uid}_light_apply_effect_night
            - script.execute: ${uid}_update_effect_highlight
            widgets:
            - label:
                align: center
                text_font: $text_font
                text_color: $label_on_color
                text: "☾ NIGHT"

script:
# ════════════════════════════════════════════════════════════════════════════════
# Switch to brightness mode
# ════════════════════════════════════════════════════════════════════════════════
- id: ${uid}_switch_to_brightness
  then:
  - lambda: id(${uid}_slider_mode) = 0;
  - lvgl.slider.update:
      id: ${uid}_main_slider
      value: !lambda return id(${uid}_current_brightness) * 255;
  - lvgl.slider.update:
      id: ${uid}_main_slider
      min_value: 2
      max_value: 255
  - script.execute: ${uid}_update_mode_buttons
  - script.execute: ${uid}_update_slider_visibility

# ════════════════════════════════════════════════════════════════════════════════
# Switch to color temperature mode
# ════════════════════════════════════════════════════════════════════════════════
- id: ${uid}_switch_to_temp
  then:
  - lambda: id(${uid}_slider_mode) = 1;
  - lvgl.slider.update:
      id: ${uid}_main_slider
      value: !lambda return (int)id(${uid}_current_color_temp);
  - lvgl.slider.update:
      id: ${uid}_main_slider
      min_value: 2000
      max_value: 6500
  - script.execute: ${uid}_update_mode_buttons
  - script.execute: ${uid}_update_slider_visibility

# ════════════════════════════════════════════════════════════════════════════════
# Switch to effect mode
# ════════════════════════════════════════════════════════════════════════════════
- id: ${uid}_switch_to_effect
  then:
  - lambda: id(${uid}_slider_mode) = 2;
  - script.execute: ${uid}_update_mode_buttons
  - script.execute: ${uid}_update_slider_visibility

# ════════════════════════════════════════════════════════════════════════════════
# Update mode button appearance
# ════════════════════════════════════════════════════════════════════════════════
- id: ${uid}_update_mode_buttons
  then:
  # Brightness button
  - if:
      condition:
        lambda: return id(${uid}_slider_mode) == 0;
      then:
      - lvgl.widget.update:
          id: ${uid}_mode_brightness_btn
          bg_color: $button_on_color
          border_color: $label_on_color
      else:
      - lvgl.widget.update:
          id: ${uid}_mode_brightness_btn
          bg_color: $button_off_color
          border_color: $label_off_color

  # Color temp button
  - if:
      condition:
        lambda: return id(${uid}_slider_mode) == 1;
      then:
      - lvgl.widget.update:
          id: ${uid}_mode_temp_btn
          bg_color: $button_on_color
          border_color: $label_on_color
      else:
      - lvgl.widget.update:
          id: ${uid}_mode_temp_btn
          bg_color: $button_off_color
          border_color: $label_off_color

  # Effect button
  - if:
      condition:
        lambda: return id(${uid}_slider_mode) == 2;
      then:
      - lvgl.widget.update:
          id: ${uid}_mode_effect_btn
          bg_color: $button_on_color
          border_color: $label_on_color
      else:
      - lvgl.widget.update:
          id: ${uid}_mode_effect_btn
          bg_color: $button_off_color
          border_color: $label_off_color

# ════════════════════════════════════════════════════════════════════════════════
# Update slider and effect area visibility
# ════════════════════════════════════════════════════════════════════════════════
- id: ${uid}_update_slider_visibility
  then:
  # Show slider for brightness and temp modes, hide for effect
  - if:
      condition:
        lambda: return id(${uid}_slider_mode) != 2;
      then:
      - lvgl.widget.show: ${uid}_main_slider
      - lvgl.widget.hide: ${uid}_effect_selection
      else:
      - lvgl.widget.hide: ${uid}_main_slider
      - lvgl.widget.show: ${uid}_effect_selection

# ════════════════════════════════════════════════════════════════════════════════
# Update effect button highlight based on current effect
# ════════════════════════════════════════════════════════════════════════════════
- id: ${uid}_update_effect_highlight
  then:
  # Day button highlight
  - if:
      condition:
        lambda: return id(${uid}_supports_day_effect);
      then:
      - if:
          condition:
            lambda: return id(${uid}_current_effect) == "day";
          then:
          - lvgl.widget.update:
              id: ${uid}_effect_day_btn
              bg_color: $button_on_color
              border_color: $label_on_color
          else:
          - lvgl.widget.update:
              id: ${uid}_effect_day_btn
              bg_color: $button_off_color
              border_color: $label_off_color

  # Night button highlight
  - if:
      condition:
        lambda: return id(${uid}_supports_night_effect);
      then:
      - if:
          condition:
            lambda: return id(${uid}_current_effect) == "night";
          then:
          - lvgl.widget.update:
              id: ${uid}_effect_night_btn
              bg_color: $button_on_color
              border_color: $label_on_color
          else:
          - lvgl.widget.update:
              id: ${uid}_effect_night_btn
              bg_color: $button_off_color
              border_color: $label_off_color

# ════════════════════════════════════════════════════════════════════════════════
# Initialize page based on light capabilities
# ════════════════════════════════════════════════════════════════════════════════
- id: ${uid}_init_page
  then:
  # Show/hide mode buttons based on capabilities
  - if:
      condition:
        lambda: return id(${uid}_supports_color_temp);
      then:
      - lvgl.widget.show: ${uid}_mode_temp_btn
      else:
      - lvgl.widget.hide: ${uid}_mode_temp_btn

  - if:
      condition:
        lambda: return id(${uid}_supports_effect);
      then:
      - lvgl.widget.show: ${uid}_mode_effect_btn
      # Show effect buttons based on capabilities
      - if:
          condition:
            lambda: return id(${uid}_supports_day_effect);
          then:
          - lvgl.widget.show: ${uid}_effect_day_btn
      - if:
          condition:
            lambda: return id(${uid}_supports_night_effect);
          then:
          - lvgl.widget.show: ${uid}_effect_night_btn
      else:
      - lvgl.widget.hide: ${uid}_mode_effect_btn

  # Initialize to brightness mode
  - script.execute: ${uid}_switch_to_brightness
